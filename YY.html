<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>喜欢你的辉辉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ✅ 新背景：高级温柔紫粉渐变（超好看、不刺眼） */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0d8e8 0%, #e2c8e7 30%, #d4b8f2 60%, #c3a6f7 100%);
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
            animation: pageFade 1.5s ease;
        }

        @keyframes pageFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .box {
            text-align: center;
            background: rgba(255,255,255,0.35);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 30px rgba(190, 150, 220, 0.3);
            z-index: 10;
            max-width: 90%;
        }

        h1 {
            font-size: 40px;
            color: #9966cc;
            margin-bottom: 15px;
            animation: textBeat 1s infinite alternate;
        }

        .text {
            font-size: 20px;
            color: #8855bb;
            line-height: 1.8;
            margin: 20px 0;
        }

        .heart {
            width: 100px;
            height: 90px;
            margin: 0 auto 30px;
            position: relative;
            animation: heartBeat 1.2s infinite;
        }

        .heart:before,
        .heart:after {
            content: '';
            position: absolute;
            top: 0;
            width: 50px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: #cc7fbb;
        }

        .heart:before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .btn-group {
            margin-top: 25px;
        }

        button {
            width: 110px;
            height: 45px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            transition: 0.2s;
        }

        #yes {
            background: #b581d6;
            color: #fff;
        }

        #no {
            background: #fff;
            color: #9966cc;
            position: relative;
            touch-action: none;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes textBeat {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        .float-heart {
            position: absolute;
            color: #cc7fbb;
            font-size: 20px;
            animation: float 5s linear infinite;
            pointer-events: none;
        }

        .click-heart {
            position: absolute;
            color: #b581d6;
            font-size: 24px;
            animation: clickFloat 1.2s ease-out forwards;
            pointer-events: none;
        }

        .firework-heart {
            position: absolute;
            font-size: 30px;
            animation: firework 1.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes clickFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        @keyframes firework {
            0% { transform: translate(0,0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.2); opacity: 0; }
        }

        .success {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(181, 129, 214, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            z-index: 999;
        }

        .main-title {
            font-size: 48px;
            animation: bigBounce 0.8s infinite alternate;
        }

        .sub-text {
            font-size: 26px;
            margin-top: 20px;
            animation: smallBounce 1s infinite alternate;
        }

        @keyframes bigBounce {
            from { transform: translateY(0) rotate(-3deg); }
            to { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes smallBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>致 YY：</h1>
        <div class="heart"></div>
        <div class="text">
            YY，我喜欢你呀～<br>
            喜欢你的性格，更喜欢你甜甜的笑容。<br>
            好想往后的路，都有你陪着我。<br>
            我会慢慢变好，努力成为最适合你的人🌹<br>
            所以……要不要做我女朋友呀？
        </div>
        <div class="btn-group">
            <button id="yes">答应你</button>
            <button id="no">暂时观望</button>
        </div>
    </div>

    <div class="success" id="successPage">
        <div class="main-title" id="mainTip">❤️ 太棒啦！❤️</div>
        <div class="sub-text" id="subTip">成功组队，快乐加倍🥰</div>
    </div>

    <script>
        const noBtn = document.getElementById('no');
        const yesBtn = document.getElementById('yes');
        const successPage = document.getElementById('successPage');
        const mainTip = document.getElementById('mainTip');
        const subTip = document.getElementById('subTip');
        let moveRange = 30;

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.classList.add('float-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 280);

        document.body.addEventListener('click', function(e) {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.classList.add('click-heart');
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1200);
        });

        function moveBtn() {
            moveRange += 8;
            const x = Math.random() * moveRange - moveRange / 2;
            const y = Math.random() * moveRange - moveRange / 2;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseover', moveBtn);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveBtn();
        });

        function fireworkHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = ['💗','❤️','💖','💕'][Math.floor(Math.random()*4)];
            heart.classList.add('firework-heart');
            const x = (Math.random() - 0.5) * 300;
            const y = (Math.random() - 0.5) * 300;
            heart.style.setProperty('--x', x + 'px');
            heart.style.setProperty('--y', y + 'px');
            heart.style.left = '50vw';
            heart.style.top = '50vh';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1800);
        }

        const titleList = [
            "❤️ 太棒啦！❤️",
            "🥳 恋爱达成！🥳",
            "💞 双向奔赴啦 💞",
            "✨ 余生请多指教 ✨"
        ];
        const textList = [
            "成功组队，快乐加倍🥰",
            "从此朝夕相伴，岁岁欢喜💓",
            "往后的路，我们一起走啦💖",
            "锁定你啦，我的女孩🌹"
        ];

        yesBtn.addEventListener('click', function () {
            successPage.style.display = 'flex';

            setInterval(createHeart, 60);
            for(let i = 0; i < 50; i++){
                setTimeout(createHeart, i * 30);
            }

            const fireTimer = setInterval(fireworkHeart, 100);
            setTimeout(() => clearInterval(fireTimer), 4000);

            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % titleList.length;
                mainTip.innerText = titleList[idx];
                subTip.innerText = textList[idx];
            }, 2500);
        });
    </script>
</body>
</html>
